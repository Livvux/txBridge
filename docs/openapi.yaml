components:
  securitySchemes:
    requestHmac:
      type: apiKey
      in: header
      name: X-TxBridge-Signature
      description: Computed per request as lowercase hex HMAC-SHA256. Requires the separate key/timestamp/nonce
        headers and a POST idempotency key. See AUTHENTICATION.md.
  parameters:
    Key:
      name: X-TxBridge-Key
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,64}$
      description: Configured key ID, not the secret.
    Timestamp:
      name: X-TxBridge-Timestamp
      in: header
      required: true
      schema:
        type: string
        pattern: ^[0-9]{10}$
      description: Unix seconds; default accepted skew ±90 seconds.
    Nonce:
      name: X-TxBridge-Nonce
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{24,128}$
      description: Fresh value for each attempt. Replays are rejected even on POST retries.
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{16,128}$
      description: Required for every POST. Reuse only for an identical retry with a fresh signature/nonce.
  schemas:
    Error:
      type: object
      properties:
        ok:
          const: false
        error:
          type: object
          properties:
            code: &id001
              type: string
            message: *id001
          additionalProperties: true
          required:
          - code
          - message
      additionalProperties: false
      required:
      - ok
      - error
    Success:
      type: object
      properties:
        ok:
          const: true
        data: {}
      additionalProperties: false
      required:
      - ok
      - data
    Status:
      type: object
      properties:
        serverId: *id001
        version: *id001
        resource: *id001
        hostname: *id001
        players:
          type: integer
          minimum: 0
        maxPlayers:
          type: integer
          minimum: 0
        bridgeStartedAt:
          type: integer
        bridgeUptimeSeconds:
          type: integer
        fxserverVersion: *id001
        monitorState: *id001
        observedAt:
          type: integer
        processState:
          const: running
        eventSequence:
          type: integer
