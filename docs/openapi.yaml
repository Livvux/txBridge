openapi: 3.1.0
info:
  title: txBridge Lua resource API
  version: 0.1.0
  description: All 21 bridge operations. HMAC signs TXBRIDGE1, server ID, key ID, method, resource-relative raw
    target, timestamp, nonce, idempotency key and body SHA256, newline-separated with no trailing newline. A static
    API key is NOT sufficient. See AUTHENTICATION.md. This is not an OpenAPI contract for txAdmin internal handlers.
  license:
    name: MIT
servers:
- url: https://bridge.example.com/txbridge
  description: Replace with the private HTTPS resource base; sign the /v1/... suffix only.
paths:
  /v1/health:
    get:
      operationId: health
      summary: Private health check
      description: 'Required scope: `status:read`. '
      x-txbridge-scope: status:read
      security:
      - requestHmac: []
      parameters:
      - $ref: '#/components/parameters/Key'
      - $ref: '#/components/parameters/Timestamp'
      - $ref: '#/components/parameters/Nonce'
      responses:
        '200':
          description: Success envelope. Check `ok` as well as HTTP status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        default:
          description: Error envelope. 409 includes replay/pending/idempotency conflicts. 503 includes bounded-store
            capacity errors. Upstream writes may have an unknown outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/status:
    get:
      operationId: status
      summary: Native/bridge status
      description: 'Required scope: `status:read`. '
      x-txbridge-scope: status:read
      security:
      - requestHmac: []
      parameters:
      - $ref: '#/components/parameters/Key'
      - $ref: '#/components/parameters/Timestamp'
      - $ref: '#/components/parameters/Nonce'
      responses:
        '200':
          description: Success envelope. Check `ok` as well as HTTP status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  data:
                    $ref: '#/components/schemas/Status'
                additionalProperties: false
                required:
                - ok
                - data
        default:
          description: Error envelope. 409 includes replay/pending/idempotency conflicts. 503 includes bounded-store
            capacity errors. Upstream writes may have an unknown outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
