# Merge into server.cfg, before ensure txbridge. DO NOT use sets or setr for secrets.
# Generate THREE INDEPENDENT values using: openssl rand -hex 32
set txbridge_server_id "main"
set txbridge_wordpress_secret "REPLACE_WITH_INDEPENDENT_API_SECRET"
set txbridge_webhook_secret "REPLACE_WITH_INDEPENDENT_WEBHOOK_SECRET"
set txbridge_privacy_secret "REPLACE_WITH_INDEPENDENT_PSEUDONYM_SECRET"
set txbridge_webhook_url "https://www.example.com/wp-json/txbridge/v1/webhook"

# Modly consumer slot (optional, independent of WordPress). Modly generates these values
# during pairing and shows them once; paste them unchanged.
# set txbridge_modly_webhook_url "https://modly.cc/api/fivem/<connection-id>/webhook"
# set txbridge_modly_webhook_secret "GENERATED_BY_MODLY"
# set txbridge_modly_secret "GENERATED_BY_MODLY"

# No txAdmin password or monitor intercom token is needed for event forwarding.
ensure txbridge

# Optional HOST STATUS ONLY; first enable Config.TxAdmin.hostStatusEnabled and
# the client's txadmin:host scope. In txAdmin's process environment, configure
# TXHOST_API_TOKEN to the same fourth independently generated secret.
# set txbridge_txadmin_url "http://127.0.0.1:40120"
# set txbridge_txadmin_host_token "REPLACE_WITH_HOST_API_SECRET"
# Keep the commented convars before ensure txbridge when enabling them.
